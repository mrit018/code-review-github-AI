name: Ollama Code Review

on:
  pull_request:
    branches: [main]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Pull model
        run: |
          ollama pull qwen2.5-coder:3b

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.py
            **/*.js
            **/*.ts

      - name: Review code with Ollama
        run: |
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "Reviewing: $file"
            content=$(cat "$file")
            review=$(ollama run qwen2.5-coder:3b "Review this code and suggest improvements:\n\n$content")
            echo "## Review: $file" >> review_report.md
            echo "$review" >> review_report.md
            echo "" >> review_report.md
          done

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review_report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: review
            });